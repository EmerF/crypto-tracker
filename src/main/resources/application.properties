spring.application.name=CryptoTracker
# PostgreSQL configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/crypto_tracker_db
spring.datasource.username=postgres
spring.datasource.password=crypto_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.platform=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
##circuit breaker
resilience4j.circuitbreaker.instances.externalApi.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.externalApi.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.externalApi.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.externalApi.slidingWindowSize=20
